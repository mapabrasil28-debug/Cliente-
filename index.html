<!--
 ╔═══════════════════════════════════════════════════════════════════════════════════╗
 ║   ▼▼▼   CONFIGURAÇÃO  —  É AQUI QUE VOCÊ COLOCA AS CHAVES E OS DADOS   ▼▼▼          ║
 ╠═══════════════════════════════════════════════════════════════════════════════════╣
 ║  • Preencha só o que fica ENTRE ASPAS '' (apague nada além do texto de exemplo).   ║
 ║  • O mesmo bloco existe nos 3 arquivos (cliente.html, prestador.html, admin.html): ║
 ║    preencha IGUAL nos três.   • Salve o arquivo COMO UTF-8 e publique.             ║
 ║  • É só TEXTO (não é programa): se errar uma aspa ou vírgula, o app mostra a       ║
 ║    linha do erro na tela. Não mexa em mais nada do arquivo.                        ║
 ║  • Passo a passo completo: arquivo LEIA-ME-HOSPEDAGEM.md                           ║
 ╚═══════════════════════════════════════════════════════════════════════════════════╝
-->
<script id="CONFIGURACAO" type="text/plain">
{

  /* ══ 1 ▸ NOME DO APP (aparece nas telas e nos Termos) ═══════════════════════════ */
  APP: 'Meu Serviço',

  /* ══ 2 ▸ FIREBASE — OBRIGATÓRIO PARA FUNCIONAR EM VÁRIOS CELULARES ═════════════════
     Onde achar: console.firebase.google.com › seu projeto › Configurações do projeto (engrenagem)
                 › "Seus apps" › app Web (ícone </>) › "Configuração do SDK" (objeto firebaseConfig).
     Copie cada valor para o campo de mesmo nome. Precisa ter ativado no Firebase:
       a) Authentication › Método de login › E-mail/senha  → ATIVAR
       b) Realtime Database › Criar banco de dados          → e colar as regras (database.rules.json)
       c) Authentication › Configurações › Domínios autorizados → adicionar o endereço do seu site
     A chave "apiKey" do Firebase NÃO é segredo (é normal ficar visível no site); quem protege seus
     dados são as REGRAS publicadas no passo (b). */
  FIREBASE: {
    apiKey: '',              // ex.: 'AIzaSyD...'
    authDomain: '',          // ex.: 'meu-projeto.firebaseapp.com'
    databaseURL: '',         // ex.: 'https://meu-projeto-default-rtdb.firebaseio.com'
    projectId: '',           // ex.: 'meu-projeto'
    storageBucket: '',       // ex.: 'meu-projeto.appspot.com'   (reservado; ainda não usado)
    messagingSenderId: '',   // ex.: '123456789012'               (reservado; ainda não usado)
    appId: '',               // ex.: '1:123456789012:web:abc123...'
    appCheckSiteKey: ''      // OPCIONAL (recomendado): chave "site" do reCAPTCHA v3 do Firebase App Check
  },

  /* (o código do primeiro administrador fica no Firebase — nó setupCode — e no admin.html) */

  /* ══ 3 ▸ DADOS DA EMPRESA (exigidos por lei nos Termos e na Política de Privacidade) ══
     Podem ser preenchidos aqui OU depois, no painel: admin › Configurações › Empresa. */
  EMPRESA: {
    razao: '',               // ex.: 'Meu Serviço Intermediação Ltda'
    cnpj: '',                // ex.: '12.345.678/0001-90'
    endereco: '',            // ex.: 'Rua X, 100, Centro, São Paulo/SP, CEP 01000-000'
    email: '',               // e-mail de suporte, ex.: 'suporte@meuservico.com.br'
    whatsapp: '',            // opcional, só números com DDD, ex.: '11999998888'
    dpo: '',                 // encarregado de dados (LGPD): nome e e-mail
    foro: ''                 // cidade/UF do foro, ex.: 'São Paulo/SP'
  },

  /* ══ 4 ▸ MAPA (preto e branco, com o nome das ruas — NÃO usa Google Maps) ═══════════
     Para começar NÃO precisa preencher nada: o app usa o mapa gratuito do OpenStreetMap e, se ele
     falhar, troca sozinho por outro servidor gratuito. Esses servidores não têm garantia.
     Antes de ter muita gente usando, peça a chave GRATUITA do CARTO (sem criar conta; chega por
     e-mail; até 1 milhão de visualizações por mês no uso comercial): https://carto.com/basemaps/apikey/
     e cole em cartoKey. Se preferir outro provedor (MapTiler, Stadia Maps...), use tileUrl.
     Atenção: a chave do CARTO, se tiver restrição de site, deve listar o endereço onde o app fica.
     Outro provedor (tileUrl) também precisa constar na linha "Content-Security-Policy" no topo do
     arquivo, na parte img-src — o guia LEIA-ME-HOSPEDAGEM.md explica em 1 minuto. */
  MAP: {
    cartoKey: '',            // ex.: 'ABCDEF123456...'   (chave gratuita do CARTO; vazio = só os servidores gratuitos)
    tileUrl: '',             // opcional: outro provedor, ex.: 'https://api.maptiler.com/maps/dataviz-light/{z}/{x}/{y}.png?key=SUA_CHAVE'
    tileAttribution: '',     // crédito exigido pelo provedor de tileUrl, ex.: '© MapTiler © OpenStreetMap'
    tileSubdomains: 'abc',
    tileMaxZoom: 19,
    grayscale: true          // true = mapa em PRETO E BRANCO com o nome das ruas (padrão); false = cores do provedor
  },
  /* Cidade onde o mapa abre quando o aparelho não informa o GPS (latitude/longitude). */
  FALLBACK_CENTER: { lat: -23.5505, lng: -46.6333 },   // São Paulo

  /* ══ 5 ▸ CORREÇÕES DE NOMES DE RUAS (opcional) ═══════════════════════════════════════
     O mapa vem do OpenStreetMap (feito por voluntários) e às vezes uma rua está com outro nome.
     Quando acontecer, acrescente uma linha igual ao exemplo (retire as duas barras do começo):
         { cidade: 'São Paulo', de: 'Nome como o mapa mostra', para: 'Nome oficial da rua' },
     Dá para cadastrar também no painel: admin › Configurações › Mapa e ruas. O jeito definitivo
     é corrigir no próprio OpenStreetMap (o guia explica). */
  RUAS: [
    // { cidade: 'São Paulo', de: 'Rua Exemplo Antiga', para: 'Rua Exemplo Nova' },
  ],

  /* ══ 6 ▸ ENDEREÇOS E ROTAS ════════════════════════════════════════════════════════
     Os padrões abaixo são serviços públicos GRATUITOS e sem chave (OpenStreetMap/Nominatim,
     ViaCEP e OSRM). Servem para começar; têm limite de uso. Com muitos usuários, troque por
     um serviço pago ou próprio, com o mesmo formato (LocationIQ, OpenCage, OSRM próprio...).
     Deixe vazio para manter o padrão. Use {lat} {lng} {q} {cep} {lat1} {lng1} {lat2} {lng2}.
     Ao trocar, acrescente o endereço do novo serviço na linha "Content-Security-Policy" (connect-src). */
  GEO: {
    reverseUrl: '',          // endereço a partir das coordenadas (formato Nominatim)
    searchUrl: '',           // coordenadas a partir do endereço digitado (formato Nominatim)
    cepUrl: '',              // consulta de CEP (formato ViaCEP)
    routeUrl: ''             // rota/tempo de chegada (formato OSRM)
  },

  /* ══ 7 ▸ REGRAS DO NEGÓCIO (valores iniciais; o admin pode mudar depois no painel) ═══ */
  OFFER_WINDOW_S: 30,        // segundos que cada prestador tem para aceitar um chamado
  DEFAULT_RADIUS_KM: 15,     // raio de atendimento padrão do prestador (km)

  /* ══ 8 ▸ PRIVACIDADE DA TELA (proteção contra print e olhares) ═══════════════════════
     Um navegador NÃO consegue impedir o print de verdade (só um app instalado consegue). Estes
     recursos dificultam e deixam o vazamento rastreável: marca d'água com a identificação de quem
     está usando e tela escondida quando o app vai para segundo plano. Deixe como está. */
  PRIVACY: {
    watermark: true,         // marca d'água com o nome/código de quem está logado, em todas as telas
    shield: true             // esconde o conteúdo quando o app sai da tela (troca de app, tela de recentes)
  },

  /* ══ 9 ▸ MODO DE FUNCIONAMENTO — esta é a versão de TESTE ═════════════
     Versão de teste: tem o botão "Modo teste" e funciona sem Firebase (dados só neste aparelho).
     Para publicar de verdade use os arquivos da pasta "final". */
  PRODUCTION: false,
  REQUIRE_ONLINE: false
}
</script>

.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pay-opt{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.pay-opt input{accent-color:var(--pink);width:20px;height:20px}
.pay-opt.on{border-color:var(--pink);background:var(--pink-soft)}
input[type=range]{width:100%;accent-color:var(--pink)}
.range-val{font-size:28px;font-weight:900;color:var(--pink)}

/* tela principal */
#map{position:absolute;inset:0;background:#EEE}
#map.gray .leaflet-tile-pane{filter:grayscale(1) contrast(1.05)}
.leaflet-container{font-family:inherit}
.leaflet-control-attribution,.leaflet-control-container .leaflet-bottom.leaflet-right{display:none!important}
.nomap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:30px;background:
  linear-gradient(#e6e6e6 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,#e6e6e6 1px,transparent 1px) 0 0/48px 48px,#f4f4f4}
.topbar{position:absolute;left:0;right:0;top:0;padding:calc(var(--safe-t) + 12px) 14px 0;display:flex;align-items:center;justify-content:space-between;pointer-events:none;z-index:500}
.topbar>*{pointer-events:auto}
.top-right{display:flex;gap:10px}
.fab-rec{position:absolute;right:14px;bottom:calc(var(--dock-h) + 14px);z-index:500}
.mk-me{position:relative;width:26px;height:26px}
.mk-me .dot{position:absolute;inset:4px;background:var(--pink);border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.mk-me .pulse{position:absolute;inset:-14px;border-radius:50%;background:var(--pink);opacity:0}
.on-line .mk-me .pulse{animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:.45}100%{transform:scale(1.5);opacity:0}}
.mk-dest{width:28px;height:28px;border-radius:8px;background:var(--ink);border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.mk-dest::after{content:"";width:9px;height:9px;background:#fff;border-radius:2px}

/* serviço em andamento */
.dock.job{display:flex;flex-direction:column;overflow:hidden;max-height:76%;padding-bottom:0}
.job-scroll{overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.job-bottom{flex:none;padding:8px 0 calc(var(--safe-b) + 12px);background:#fff}
.job-head{display:flex;align-items:center;gap:12px}
.job-head .who{flex:1;min-width:0}
.job-head .who b{display:block;font-size:19px}
.job-state{font-size:13px;font-weight:800;color:var(--pink);text-transform:uppercase;letter-spacing:.5px}
.round{width:46px;height:46px;border-radius:50%;border:0;background:var(--bg2);font-size:20px;display:flex;align-items:center;justify-content:center;position:relative;text-decoration:none;color:var(--ink);flex:none}
.job-box{background:var(--bg2);border-radius:16px;padding:12px 14px;margin-top:12px}
.job-box .l{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.job-box b{display:block;font-size:17px}
.job-price{display:flex;align-items:baseline;justify-content:space-between;margin-top:12px}
.job-price .v{font-size:30px;font-weight:900;color:var(--green);letter-spacing:-.8px}
.job-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.job-main{margin-top:0}
.job-foot{display:flex;justify-content:center;margin-top:2px}
.job-foot button{background:none;border:0;color:var(--red);font-weight:800;padding:10px 4px;font-size:14px}
.job-foot button.s{color:var(--ink2)}
.dock-toggle{width:44px;height:5px;border-radius:3px;background:var(--line);margin:-8px auto 12px;display:block;border:0;padding:0}
.collapsed .job-det{display:none}

/* chat */
.chat-list{display:flex;flex-direction:column;gap:8px;padding:6px 0 10px}
.msg{max-width:80%;padding:10px 14px;border-radius:18px;font-size:15.5px;word-wrap:break-word;white-space:pre-wrap}
.msg small{display:block;font-size:11px;opacity:.65;margin-top:3px}
.msg.me{align-self:flex-end;background:var(--pink);color:#fff;border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:var(--bg2);border-bottom-left-radius:6px}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12.5px;text-align:center;font-weight:600;max-width:92%}
.quick{display:flex;gap:8px;overflow-x:auto;padding:8px 0;margin:0 -4px}
.quick button{flex:none;border:1.5px solid var(--pink-line);background:var(--pink-soft);color:var(--pink-dark);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px}
.chat-in{display:flex;gap:10px;padding:10px 16px calc(var(--safe-b) + 12px);border-top:1px solid var(--line)}
.chat-in input{flex:1;min-height:48px;border-radius:24px;border:1.5px solid var(--line);padding:0 18px;background:var(--bg2);outline:none}
.chat-in input:focus{border-color:var(--pink);background:#fff}
.chat-in button{width:48px;height:48px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:20px}
/* mensagem sobreposta em tela cheia */
#msgov{position:absolute;inset:0;z-index:2000;display:none;flex-direction:column;justify-content:center;padding:26px;background:var(--pink);color:#fff}
#msgov.on{display:flex;animation:fade .15s}
#msgov .from{font-size:14px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;opacity:.85}
#msgov .txt{font-size:30px;font-weight:800;line-height:1.2;margin:14px 0 26px;word-wrap:break-word;letter-spacing:-.4px}
#msgov input{width:100%;min-height:54px;border-radius:16px;border:0;padding:0 18px;font-size:17px;margin-bottom:12px;outline:none;color:var(--ink)}
#msgov .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#msgov .btn{background:#fff;color:var(--pink-dark)}
#msgov .btn.line{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}

/* bloqueio */
#blocked{position:absolute;inset:0;z-index:1800;background:#fff;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px}
#blocked.on{display:flex}
#blocked .ico{font-size:64px;margin-bottom:12px}
#blocked h2{font-size:26px;font-weight:900;margin-bottom:8px}
#blocked .why{background:var(--red-soft);color:var(--red);border-radius:16px;padding:14px 16px;font-weight:700;margin:14px 0;max-width:420px;text-align:left;white-space:pre-line}

/* menu lateral */
.drawer-wrap{position:absolute;inset:0;pointer-events:auto}
.drawer-wrap .backdrop{position:absolute;inset:0;background:rgba(15,15,20,.5);opacity:0;transition:opacity .2s}
.drawer-wrap.in .backdrop{opacity:1}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(86%,340px);background:#fff;transform:translateX(-100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:var(--safe-t)}
.drawer-wrap.in .drawer{transform:none}
.dr-head{padding:22px 20px;background:var(--pink);color:#fff;display:flex;gap:14px;align-items:center}
.dr-head .avatar{width:62px;height:62px;background:#fff;color:var(--pink)}
.dr-head b{font-size:19px;display:block}
.dr-head span{font-size:14px;opacity:.95}
.dr-list{flex:1;overflow-y:auto;padding:8px 8px}
.dr-item{display:flex;align-items:center;gap:16px;width:100%;padding:14px 14px;border:0;background:none;border-radius:14px;text-align:left;font-weight:700;font-size:16px;position:relative}
.dr-item:active{background:var(--bg2)}
.dr-item .em{font-size:22px;width:28px;text-align:center}
.dr-item .cnt{margin-left:auto;background:var(--pink);color:#fff;border-radius:999px;font-size:12px;padding:2px 9px}
.dr-foot{padding:12px 20px calc(var(--safe-b) + 14px);color:var(--muted);font-size:12px;border-top:1px solid var(--line)}

/* ganhos */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg2);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;padding:10px 0;border-radius:11px;font-weight:800;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--pink);box-shadow:var(--shadow-s)}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.kv b{font-weight:800}
.note-mid{background:var(--pink-soft);color:var(--pink-dark);padding:10px 12px;border-radius:12px;font-size:13px;font-weight:600;margin:12px 0}
.star-pick{display:flex;justify-content:center;gap:8px;margin:14px 0}
.star-pick button{border:0;background:none;font-size:46px;line-height:1;color:#D9D9DE;padding:2px}
.star-pick button.on{color:#F5A623}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);gap:14px}
.toggle small{display:block;color:var(--muted);font-weight:500}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;inset:0;margin:0;cursor:pointer;z-index:2}
.switch i{position:absolute;inset:0;border-radius:15px;background:#D5D5DA;transition:.2s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.switch input:checked+i{background:var(--pink)}
.switch input:checked+i::after{transform:translateX(22px)}
details.faq{border-bottom:1px solid var(--line);padding:12px 0}
details.faq summary{font-weight:700;cursor:pointer}
details.faq p{color:var(--ink2);margin-top:8px;font-size:15px}

/* ícones desenhados (não dependem das fontes do aparelho) */
.ic{display:inline-flex;width:22px;height:22px;flex:none;align-items:center;justify-content:center}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sh-head .icon-btn .ic{width:18px;height:18px}
.cat-head .arrow.ic{width:20px;height:20px;transition:transform .2s}
.chat-in button .ic{width:22px;height:22px}
/* aviso do mapa */
.map-msg{position:absolute;left:14px;right:14px;top:calc(var(--safe-t) + 72px);z-index:480;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);font-size:14px;font-weight:600;display:flex;gap:12px;align-items:center}
.map-msg .btn{min-height:38px;padding:0 14px;font-size:14px;flex:none}
/* perfil protegido */
.lock-box{display:flex;gap:12px;align-items:flex-start;background:var(--pink-soft);color:var(--pink-dark);border-radius:14px;padding:12px 14px;font-size:13.5px;font-weight:600;margin:6px 0 4px}
.lock-box .ic{margin-top:1px}
.prot-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.prot-row .grow{flex:1;min-width:0}
.prot-row .grow b{display:block}
.prot-row .grow span{font-size:13px;color:var(--muted);display:block;margin-top:1px}
.prot-row .btn{min-height:40px;padding:0 14px;font-size:14px;flex:none}
.prot-row .avatar{width:56px;height:56px}
.geo-help{font-size:13px;color:var(--ink2);margin-top:8px}
.dock-acts{display:flex;gap:10px;justify-content:center;margin-top:12px}
.dock-acts .btn{min-height:42px;font-size:14px}

.avatar.big{width:84px;height:84px;font-size:30px;margin:0 auto}

/* ======================= início: categorias ======================= */
.home-top{position:sticky;top:0;z-index:20;background:#fff;padding:calc(var(--safe-t) + 12px) 16px 10px;display:flex;align-items:center;gap:12px}
.home-top .icon-btn{box-shadow:none;background:var(--bg2)}
.home-top .hi{flex:1;min-width:0}
.home-top .hi small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.home-top .hi b{display:block;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-intro{padding:6px 20px 4px}
.home-intro h1{font-size:30px;line-height:1.08;font-weight:900;letter-spacing:-.8px}
.home-intro p{color:var(--muted);margin-top:8px;font-size:15px}
.home-search{padding:14px 16px 6px;position:sticky;top:calc(var(--safe-t) + 66px);z-index:19;background:#fff}
.home-search input{display:block;width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);padding:0 16px;background:var(--bg2);outline:none;font-size:16px}
.home-search input:focus{border-color:var(--pink);background:#fff;box-shadow:0 0 0 3px var(--pink-soft)}
.cat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px 12px calc(var(--safe-b) + 30px)}
.cat-card{border:1.5px solid var(--line);border-radius:18px;background:#fff;padding:12px 4px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;min-height:104px;min-width:0;transition:transform .08s,border-color .15s}
.cat-card:active{transform:scale(.96);border-color:var(--pink);background:var(--pink-soft)}
.cat-card .em{font-size:30px;line-height:1.1}
.cat-card b{font-size:12.5px;line-height:1.16;font-weight:800;max-width:100%;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.cat-card.long b{font-size:11px;letter-spacing:-.1px}
.cat-card small{display:none}
@media (min-width:520px){.cat-grid{gap:12px;padding-left:20px;padding-right:20px}.cat-card{min-height:120px}.cat-card b{font-size:14px}.cat-card .em{font-size:34px}}
.cat-empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 10px}
.active-banner{margin:2px 16px 8px;border-radius:20px;background:var(--pink);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 22px rgba(222,20,120,.32)}
.active-banner .tx{flex:1;min-width:0}
.active-banner b{display:block;font-size:16px}
.active-banner span{font-size:13px;opacity:.95}
.active-banner .btn{background:#fff;color:var(--pink-dark);min-height:42px;padding:0 16px}

/* ======================= fluxo: opções / valor / pagamento ======================= */
#scr-flow{display:none;flex-direction:column;overflow:hidden}
#scr-flow.on{display:flex}
#fl-body{flex:1;overflow-y:auto;padding:18px 20px 24px;-webkit-overflow-scrolling:touch}
#fl-body h2{font-size:24px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
#fl-body .lead{color:var(--muted);margin-bottom:16px}
.fl-cat{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.fl-cat .em{font-size:40px}
.opt-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:16px 16px;margin-bottom:10px;font-weight:700;font-size:16px}
.opt-btn:active{border-color:var(--pink);background:var(--pink-soft)}
.opt-btn .nm{flex:1}
.opt-btn .ic{color:var(--muted)}
.price-hero{text-align:center;padding:22px 16px 20px;border-radius:26px;background:var(--green-soft);margin-bottom:14px}
.price-hero .k{font-size:12px;font-weight:800;color:var(--green);letter-spacing:.7px;text-transform:uppercase}
.price-hero .v{font-size:58px;line-height:1.05;font-weight:900;color:var(--green);letter-spacing:-2px;margin:4px 0 6px}
.price-hero .sv{font-weight:800;font-size:17px}
.price-hero .sc{color:var(--ink2);font-size:14px;margin-top:2px}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.other-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 6px}
.other-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 2px;font-size:15px}
.other-opt .nm{flex:1;font-weight:600}
.other-opt .pr{font-weight:900;color:var(--green)}
.other-opt.sel{background:var(--pink-soft);border-radius:12px;border-bottom-color:transparent;padding-left:10px;padding-right:10px}
.pay-card{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;background:#fff}
.pay-card input{accent-color:var(--pink);width:22px;height:22px;margin-top:1px;flex:none}
.pay-card .ic2{font-size:26px;width:34px;text-align:center;flex:none}
.pay-card b{display:block;font-size:16px}
.pay-card small{display:block;color:var(--muted);margin-top:1px}
.pay-card.on{border-color:var(--pink);background:var(--pink-soft)}
.sum-box{background:var(--bg2);border-radius:16px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.sum-box .em{font-size:28px}
.sum-box .tx{flex:1;min-width:0}
.sum-box .tx b{display:block}
.sum-box .tx span{font-size:13px;color:var(--muted)}
.sum-box .pr{font-weight:900;color:var(--green);font-size:20px}

/* ======================= mapa: endereço / busca / acompanhamento ======================= */
#scr-map{overflow:hidden}
#mapbox{position:absolute;left:0;right:0;top:0;bottom:var(--dock-h)}
.top-pill{background:#fff;border-radius:999px;box-shadow:var(--shadow-s);padding:0 18px;height:44px;display:flex;align-items:center;font-weight:800;font-size:15px;max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center-pin{position:absolute;left:50%;top:50%;width:40px;height:52px;margin:-52px 0 0 -20px;z-index:450;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));transition:transform .15s}
.center-pin svg{width:40px;height:52px;display:block}
.center-pin i{position:absolute;left:12px;bottom:-4px;width:16px;height:6px;border-radius:50%;background:rgba(0,0,0,.28);filter:blur(1px)}
.center-pin.lift{transform:translateY(-10px)}
.panel{position:absolute;left:0;right:0;bottom:0;z-index:600;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.18);padding:16px 20px calc(var(--safe-b) + 16px);max-height:68%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.panel h3{font-size:20px;font-weight:900;letter-spacing:-.3px}
.panel .sub{color:var(--muted);font-size:14px;margin-top:2px}
.panel .field{margin-bottom:10px}
.panel .field input{min-height:46px;padding:10px 14px}
.panel .field>span{margin-bottom:4px}
.geo-line{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 12px;background:var(--bg2);font-size:13.5px;font-weight:600;margin:10px 0 12px}
.geo-line.ok{background:var(--green-soft);color:var(--green)}
.geo-line.bad{background:var(--red-soft);color:var(--red)}
.geo-line.wait{background:var(--pink-soft);color:var(--pink-dark)}
.geo-line .grow{flex:1}
.geo-line .btn{min-height:36px;padding:0 12px;font-size:13px}
.geo-help{font-size:13px;color:var(--ink2);margin:0 0 10px}
.geo-help ol{margin:6px 0 0 18px;padding:0}
.mk-radar{position:relative;width:0;height:0}
.mk-radar i{position:absolute;left:-70px;top:-70px;width:140px;height:140px;border-radius:50%;border:2px solid var(--pink);background:rgba(222,20,120,.10);opacity:0;animation:radar 2.6s ease-out infinite}
.mk-radar i:nth-child(2){animation-delay:.85s}
.mk-radar i:nth-child(3){animation-delay:1.7s}
.mk-radar b{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--pink);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
@keyframes radar{0%{transform:scale(.15);opacity:.9}100%{transform:scale(1.1);opacity:0}}
.mk-prov{width:38px;height:38px;border-radius:50%;background:var(--pink);border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff}
.mk-prov svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dots{display:inline-flex;gap:4px;margin-left:4px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--pink);animation:dotb 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dotb{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
.search-head{display:flex;align-items:center;gap:12px}
.search-head .tm{margin-left:auto;font-weight:900;font-size:18px;color:var(--pink);font-variant-numeric:tabular-nums}
.srch-state{background:var(--pink-soft);color:var(--pink-dark);border-radius:14px;padding:11px 14px;font-weight:600;font-size:14px;margin:12px 0}
.pix-box{background:var(--green-soft);border-radius:16px;padding:12px 14px;margin-top:12px}
.pix-box .l{font-size:12px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.5px}
.pix-box .k{display:flex;align-items:center;gap:10px;margin-top:4px}
.pix-box .k b{flex:1;word-break:break-all;font-size:16px}
.pix-box .btn{min-height:38px;padding:0 14px;font-size:14px}
.pix-box small{display:block;color:var(--ink2);margin-top:6px}
.eta{font-weight:800}
.panel .job-bottom{padding:12px 0 0;background:transparent}
.panel .job-foot button{color:var(--red)}
.cancel-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px;margin-bottom:8px;font-weight:600;font-size:15.5px}
.cancel-opt:active{border-color:var(--pink);background:var(--pink-soft)}
.rate-who{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 4px}
.hist-st{font-size:12px;font-weight:800}
.hist-st.ok{color:var(--green)}.hist-st.no{color:var(--red)}.hist-st.run{color:var(--pink)}
.tag-demo{display:inline-block;background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:800;margin-left:6px}
.big-green{font-size:46px;font-weight:900;color:var(--green);letter-spacing:-1.6px;text-align:center;line-height:1.1}
.panel.has-foot{display:flex;flex-direction:column;padding:0;overflow:hidden;max-height:62%}
.pn-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 20px 4px;flex:1;min-height:0}
.pn-foot{flex:none;padding:10px 20px calc(var(--safe-b) + 14px);border-top:1px solid var(--line);background:#fff}
.grid-rn{display:grid;grid-template-columns:1fr 96px;gap:10px}
.grid-bcu{display:grid;grid-template-columns:1fr 1fr 62px;gap:10px}
.grid-rn .field,.grid-bcu .field,.panel .grid2 .field{margin-bottom:8px}
.panel .field>span{font-size:12px}
.panel .field input{min-height:42px;padding:8px 12px;font-size:15px}
.chip-acts{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 2px}
.chip-acts .btn{min-height:38px;padding:0 12px;font-size:13.5px;border-radius:12px}
.geo-line{margin:8px 0 10px;padding:8px 12px;font-size:13px}
.job-sum{display:none;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.collapsed .job-sum{display:flex}
.job-sum .v{font-weight:900;color:var(--green);font-size:20px;letter-spacing:-.3px}
.job-sum .ad{flex:1;min-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.job-sum .btn{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.panel.collapsed{padding-bottom:calc(var(--safe-b) + 8px)}

#sv-boot{position:fixed;inset:0;z-index:99998;background:#DE1478;color:#fff;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .35s}
#sv-boot.off{opacity:0;pointer-events:none}
#sv-boot .sv-box{text-align:center;padding:24px;max-width:420px}
#sv-boot .sv-logo,#sv-boot .sv-ico{font-size:54px;margin-bottom:10px}
#sv-boot b{display:block;font-size:22px;letter-spacing:-.3px}
#sv-boot span{display:block;opacity:.85;margin-top:6px;font-size:14px}
#sv-boot h2{font-size:21px;margin:0 0 10px}
#sv-boot p{font-size:15px;line-height:1.45;margin:0 0 18px;opacity:.95}
#sv-boot button{background:#fff;color:#DE1478;border:0;border-radius:14px;font-weight:800;font-size:16px;padding:14px 22px}
#sv-boot small{display:block;margin-top:18px;opacity:.7;font-size:12px}
#sv-boot code{font-family:ui-monospace,Menlo,Consolas,monospace}
noscript .sv-nojs{position:fixed;inset:0;z-index:99999;background:#DE1478;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font:600 17px/1.4 system-ui,sans-serif}
</style>
</head>
<body>
<div id="app">

  <!-- Entrar / criar conta -->
  <section id="scr-auth" class="screen"></section>

  <!-- Cadastro do cliente em etapas -->
  <section id="scr-wizard" class="screen">
    <div class="wz-head">
      <div class="wz-top">
        <button class="back" id="wz-back" aria-label="Voltar">←</button>
        <div class="ttl"><b id="wz-title">Cadastro</b><span id="wz-step">Etapa 1 de 4</span></div>
      </div>
      <div class="wz-prog" id="wz-prog"></div>
    </div>
    <div id="wz-body"></div>
    <div class="wz-foot"><button class="btn pink lg block" id="wz-next">Continuar</button></div>
  </section>

  <!-- Início: as 33 categorias -->
  <section id="scr-home" class="screen">
    <header class="home-top">
      <button class="icon-btn" id="btn-menu" aria-label="Abrir menu"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span></button>
      <div class="hi"><small id="hi-small">Olá,</small><b id="hi-name">Cliente</b></div>
      <button class="icon-btn" id="btn-safety" aria-label="Segurança"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.6-3.1 8.2-7.5 9.5-4.4-1.3-7.5-4.9-7.5-9.5V6L12 3z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg></span></button>
    </header>
    <div id="notice-bar" class="notice-bar hide" role="status" aria-live="polite"></div>
    <div id="active-banner" class="active-banner hide"></div>
    <div class="home-intro"><h1>O que você precisa hoje?</h1><p>Escolha o serviço, veja o valor e peça. O pagamento é direto com o prestador, sem taxa da plataforma.</p></div>
    <div class="home-search"><input id="cat-q" type="search" placeholder="Buscar serviço (ex.: eletricista, unha...)" aria-label="Buscar serviço" autocomplete="off"></div>
    <div id="cat-grid" class="cat-grid"></div>
  </section>

  <!-- Fluxo do pedido: opções → valor → pagamento -->
  <section id="scr-flow" class="screen">
    <div class="wz-head">
      <div class="wz-top">
        <button class="back" id="fl-back" aria-label="Voltar">←</button>
        <div class="ttl"><b id="fl-title">Serviço</b><span id="fl-step"></span></div>
      </div>
      <div class="wz-prog" id="fl-prog"></div>
    </div>
    <div id="fl-body"></div>
    <div class="wz-foot" id="fl-foot"></div>
  </section>

  <!-- Mapa: endereço → procurando prestador → acompanhamento -->
  <section id="scr-map" class="screen">
    <div id="mapbox">
      <div id="map"></div>
      <div id="pin" class="center-pin hide" aria-hidden="true"><svg viewBox="0 0 40 52"><path d="M20 50C20 50 4 33 4 20a16 16 0 0 1 32 0c0 13-16 30-16 30z" fill="#DE1478" stroke="#fff" stroke-width="3"/><circle cx="20" cy="20" r="6" fill="#fff"/></svg><i></i></div>
    </div>
    <div id="map-msg" class="map-msg hide" role="status"></div>
    <div class="topbar">
      <button class="icon-btn" id="mp-back" aria-label="Voltar"><span class="ic"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></span></button>
      <span class="top-pill" id="mp-title">Endereço</span>
      <div class="top-right"><button class="icon-btn" id="mp-menu" aria-label="Abrir menu"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span></button></div>
    </div>
    <button class="icon-btn fab-rec" id="btn-rec" aria-label="Minha localização"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.6"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></span></button>
    <div id="panel" class="panel"></div>
  </section>

  <!-- mensagem do prestador sobrepondo a tela inteira -->
  <div id="msgov"></div>

  <!-- conta suspensa / bloqueada / aguardando aprovação -->
  <div id="blocked"></div>

  <div id="layer"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<div id="sv-boot"><div class="sv-box"><div class="sv-logo">🛠️</div><b>Meu Serviço</b><span>Carregando…</span></div></div>
<noscript><div class="sv-nojs">Para usar este app é preciso ativar o JavaScript do navegador.</div></noscript>

  /* Contrato para o app Administrativo (pedidos de alteração do prestador):

  SV.init = function () {

  // Cada app chama SV.start('cliente' | 'prestador' | 'admin', função_de_início).

  SV.bootDone = function () { var b = document.getElementById('sv-boot'); if (b) { b.classList.add('off'); setTimeout(function () { b.remove(); }, 400); } };
  // Sem atributos onclick/onerror nos textos (a política de segurança do navegador proíbe script embutido em atributo):

  document.addEventListener('error', function (e) { var t = e.target; if (t && t.tagName === 'IMG' && t.getAttribute('data-rm') === '1') t.remove(); }, true);

  // Confere o que foi colado no bloco CONFIGURAÇÃO e devolve a lista do que está CLARAMENTE errado: [['FIREBASE.campo', 'motivo'], ...]
  SV.configProblems = function () {

    ['apiKey', 'authDomain', 'databaseURL', 'projectId', 'appId'].forEach(function (k) {
      var v = val(k); if (!v) bad(k, 'está vazio'); else if (/\s/.test(v) || /\.\.\.$/.test(v) || EX.indexOf(v.toLowerCase()) > -1 || /^(sua|seu)_/i.test(v)) bad(k, 'ainda é o texto de exemplo (ou tem espaço no meio)');
    });
    if (val('databaseURL') && !/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)\/?$/i.test(val('databaseURL'))) bad('databaseURL', 'deveria ser algo como https://meu-projeto-default-rtdb.firebaseio.com');
    if (val('authDomain') && !/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(val('authDomain'))) bad('authDomain', 'deveria ser algo como meu-projeto.firebaseapp.com (sem https:// e sem barra)');
    if (val('apiKey') && !/^AIza/.test(val('apiKey'))) { try { console.warn('[SV] FIREBASE.apiKey não começa com "AIza": confira se copiou do app Web do Firebase.'); } catch (e) {} }
    return out;
  };
  SV.bootError = function (e) {

    if (c === 'configparse') { t = 'Erro de digitação na CONFIGURAÇÃO'; m = 'O bloco <b>CONFIGURAÇÃO</b> no topo do arquivo .html tem um erro (linha <b>' + e.line + '</b>, coluna ' + e.col + '): ' + SV.esc(e.message) + '<br><code style="display:block;margin-top:8px;text-align:left;font-size:12px;word-break:break-all;background:rgba(0,0,0,.18);padding:8px;border-radius:8px">' + SV.esc(e.text || '') + '</code>'; }
    else if (e === 'config' || c === 'config') { t = 'Configuração incompleta'; m = 'Este app ainda não foi ligado ao Firebase. Abra o arquivo .html em um editor de texto e preencha o bloco <b>CONFIGURAÇÃO</b> no topo' + (probs.length ? ':<br>' + probs.map(function (x) { return '<b>' + SV.esc(x[0]) + '</b> ' + SV.esc(x[1]); }).join('<br>') : '.'); }
    else if (c === 'sdk') { t = 'Sem conexão com o Firebase'; m = 'Não consegui carregar o Firebase. Verifique a internet do aparelho (ou se algum bloqueador está impedindo gstatic.com) e tente de novo.'; }

    else if (c === 'timeout') { t = 'O banco não respondeu'; m = 'Confira se a <b>databaseURL</b> está certa e se o Realtime Database foi criado no projeto. Depois atualize esta página.'; }
    else { t = 'Não foi possível iniciar'; m = 'Ocorreu um erro ao conectar ao banco de dados (' + SV.esc(String((e && (e.message || e.code)) || c)) + ').'; }
    var b = document.getElementById('sv-boot') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'sv-boot' }));

  };
  SV.start = function (role, cb) {
    SV.ROLE = role;

  };

<script>
/* =====================================================================
   SV.vault — cofre de criptografia (mesmo modelo de segurança do Uber)

   O que é protegido e quem consegue abrir:
   • DOCUMENTOS (foto do documento, selfie, comprovante): cifrados NO CELULAR de quem envia (AES-256-GCM) antes de sair.
     A chave de cada documento é "embrulhada" para a chave pública da EMPRESA e para o dono. Só a equipe que a empresa liberar abre.
   • CHAT: cada mensagem é cifrada no aparelho (AES-256-GCM). A chave da conversa é embrulhada para o cliente, para o prestador e
     para a EMPRESA. O servidor (Firebase) só guarda texto embaralhado. A administração CONSEGUE abrir (para segurança e denúncias)
     e cada abertura fica registrada. Não é "ponta a ponta": a empresa é uma das pontas, de propósito.
   • ÁUDIO (opcional, ver rec.js): cifrado no aparelho, só a empresa tem a chave; só sai do aparelho junto de uma denúncia.

   Peças:
   • identidade de cada conta = par de chaves P-256 (ECDH). A parte privada fica no aparelho como chave NÃO exportável (IndexedDB)
     e uma cópia cifrada pela SENHA da conta fica no servidor (keysPrivate), para entrar em outro aparelho sem perder as conversas.
   • chave da empresa (org) = par P-256 criado no primeiro acesso do administrador. A parte privada é embrulhada para cada pessoa da
     equipe liberada e há um CÓDIGO DE RECUPERAÇÃO impresso/guardado fora do sistema.
   • embrulhar = ECDH efêmero + HKDF-SHA256 + AES-256-GCM (esquema "ECIES"), com contexto amarrado (pedido, documento, destinatário).

        return Promise.all(Object.keys(pids).map(function (pid) {
          return remoteGet(ckPath(rid, pid)).then(function (node) {
            if (!node || !node.w || !node.w.org || !node.chk) return [pid, null];
            return unwrapWith(priv, node.w.org, ckCtx(rid, pid, 'org')).then(function (K) {
              return aesKey(K).then(function (k) { K.fill(0); return aesDec(k, node.chk, chkAad(rid, pid)).then(function () { return [pid, k]; }, function () { return [pid, 'bad']; }); });
            }).catch(function () { return [pid, null]; });
          });
        })).then(function (pairs) {
          var keys = {}; pairs.forEach(function (p) { keys[p[0]] = p[1]; });
          return Promise.all(msgs.map(function (m) {
            if (!m.c) return Promise.resolve(Object.assign({}, m));
            var key = keys[m.k]; if (!key || key === 'bad') return Promise.resolve(Object.assign({}, m, { texto: null, locked: true, bad: key === 'bad' }));
            return aesDec(key, m, msgAad(rid, m.id, m.de, m.ts, m.k)).then(function (b) { return Object.assign({}, m, { texto: JSON.parse(TD.decode(b)).t }); }, function () { return Object.assign({}, m, { texto: null, locked: true, bad: true }); });
          })).then(function (list) { return { locked: false, state: 'ready', list: list.sort(function (a, b) { return a.ts - b.ts; }) }; });
        });
      });
    },
    forgetKeys: function () { CK = {}; }
  };

  /* ------------------------------ SV.chat (usado pelos apps) ------------------------------ */
  var reqOf = function (rid) { return SV.db.get('requests/' + rid) || null; };
  var known = {};   // 'pedido|mensagem' -> texto já aberto (a própria mensagem aparece sem esperar para abrir de novo)
  //@DEMO-START
  function demoPlain(reqId, from, name, text) { var id = SV.uid('m_'); SV.db.set('chats/' + reqId + '/' + id, { id: id, de: from, nome: name, texto: text, ts: Date.now() }); return true; }
  //@DEMO-END
  // Envia uma mensagem do chat (cifrada no aparelho). Devolve Promise<boolean>.
  SV.chat.send = function (reqId, from, name, text) {
    text = String(text || '').trim().slice(0, 1000); if (!text) return Promise.resolve(false);
    var req = reqOf(reqId); if (!req || !req.providerId) return Promise.resolve(false);
    var myId = idOfRole(req, from);
    function fail() { SV.emit('chat:unavailable', { reqId: reqId }); return false; }
    function noKey() {
      if (SV.CONFIG.DEMO_MODE) return demoPlain(reqId, from, name, text); //@DEMO-LINE
      return fail();
    }
    var p = V.ok() ? V.chat.seal(req, myId, from, text) : Promise.resolve(null);
    return p.then(function (rec) {
      if (!rec) return noKey();
      known[reqId + '|' + rec.id] = text;
      return dbSet('chats/' + reqId + '/' + rec.id, rec).then(function () { return true; }, fail);
    }, noKey);
  };
  // Acompanha a conversa. cb(lista) recebe as mensagens já abertas, em ordem: { id, de, nome, texto, ts, locked? }.
  // role: 'cliente' | 'prestador'. Devolve a função que para de acompanhar.
  SV.chat.watch = function (reqId, role, cb) {
    var alive = true, seq = 0, retry = null, tries = 0;
    function refresh() {
      var my = ++seq, req = reqOf(reqId), c = SV.db.get('chats/' + reqId) || {};
      var msgs = Object.keys(c).map(function (k) { return c[k]; }).filter(function (m) { return m && m.id; });
      var myId = req ? idOfRole(req, role) : null;
      clearTimeout(retry);
      Promise.all(msgs.map(function (m) {
        var nome = req ? (m.de === 'prestador' ? req.providerNome : m.de === 'cliente' ? req.clientNome : 'Sistema') : '';
        if (!m.c) {   // aviso do sistema (texto simples)
          var plain = { id: m.id, de: m.de, nome: m.nome || nome, texto: String(m.texto == null ? '' : m.texto), ts: m.ts };
          if (m.de === 'sistema') return Promise.resolve(plain);
          if (SV.CONFIG.DEMO_MODE) return Promise.resolve(plain); //@DEMO-LINE
          return Promise.resolve(null);   // mensagem de cliente/prestador sem cifra: ignorada
        }
        var kn = known[reqId + '|' + m.id]; if (kn != null) return Promise.resolve({ id: m.id, de: m.de, nome: nome, texto: kn, ts: m.ts });
        return V.chat.open(req || { id: reqId }, myId, m).then(function (t) {
          if (t != null) known[reqId + '|' + m.id] = t;
          return { id: m.id, de: m.de, nome: nome, texto: t != null ? t : '🔒 Mensagem protegida (não foi possível abrir neste aparelho)', ts: m.ts, locked: t == null };
        });
      })).then(function (list) {
        if (!alive || my !== seq) return;
        list = list.filter(Boolean).concat(SV.chat.events(req)).sort(function (a, b) { return a.ts - b.ts; });
        try { cb(list); } catch (e) { console.error(e); }
        if (list.some(function (x) { return x.locked; }) && tries < 6) retry = setTimeout(function () { tries++; refresh(); }, 2500 * (tries + 1));   // a chave pode estar chegando
        else tries = 0;
      });
    }
    var off = SV.db.on('chats/' + reqId, refresh);
    var offReq = SV.db.on('requests/' + reqId, function (r) { if (r) refresh(); });   // trocou de prestador / mudou o andamento (avisos do sistema): confere de novo
    return function () { alive = false; clearTimeout(retry); try { off(); } catch (e) {} try { offReq(); } catch (e) {} };
  };
  // equipe: acompanha a conversa de um pedido (abre com a chave da empresa). cb({ locked, state, list })
  SV.chat.watchStaff = function (reqId, staffId, cb) {
    var alive = true, seq = 0;
    function refresh() {
      var my = ++seq, c = SV.db.get('chats/' + reqId) || {}, msgs = Object.keys(c).map(function (k) { return c[k]; }).filter(function (m) { return m && m.id; });
      V.chat.openAllStaff(reqId, staffId, msgs).then(function (r) {
        if (!alive || my !== seq) return;
        if (r && r.list) r = Object.assign({}, r, { list: r.list.concat(SV.chat.events(reqOf(reqId))).sort(function (a, b) { return a.ts - b.ts; }) });
        try { cb(r); } catch (e) { console.error(e); }
      });
    }
    var off = SV.db.on('chats/' + reqId, refresh), offReq = SV.db.on('requests/' + reqId, function (r) { if (r) refresh(); });
    return function () { alive = false; try { off(); } catch (e) {} try { offReq(); } catch (e) {} };
  };

  /* ------------------------ rascunhos protegidos neste aparelho ------------------------ */
  // Chave AES do aparelho (NÃO exportável), usada só para o rascunho do cadastro (documentos e dados pessoais ficam cifrados em disco).
  var DEVK = null;
  function devKey() {
    if (!DEVK) DEVK = kvGet('dev').then(function (r) { if (r && r.key) return r.key; return subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']).then(function (k) { return kvPut({ id: 'dev', key: k }).then(function () { return k; }); }); });
    return DEVK;
  }
  V.dev = {
    enc: function (str) { return devKey().then(function (k) { return aesEnc(k, TE.encode(String(str)), AAD0 + 'dev'); }).then(function (o) { return 'sd1.' + o.i + '.' + o.c; }); },
    dec: function (s) {
      var m = /^sd1\.([A-Za-z0-9+\/=]+)\.([A-Za-z0-9+\/=]+)$/.exec(String(s || '')); if (!m) return Promise.resolve(null);
      return devKey().then(function (k) { return aesDec(k, { i: m[1], c: m[2] }, AAD0 + 'dev'); }).then(function (b) { return TD.decode(b); }, function () { return null; });
    }
  };

  // Rascunho do cadastro (dados pessoais e documentos já escolhidos): fica CIFRADO no aparelho. Sem criptografia disponível, não grava.
  var dseq = {};
  SV.draft = {
    save: function (key, obj) {
      if (!V.ok()) return; var my = dseq[key] = (dseq[key] || 0) + 1;
      V.dev.enc(JSON.stringify(obj)).then(function (s) { if (dseq[key] === my) { try { localStorage.setItem(key, s); } catch (e) {} } }, function () {});
    },
    load: function (key) {
      var raw = null; try { raw = localStorage.getItem(key); } catch (e) {} if (!raw) return Promise.resolve(null);
      if (raw.charAt(0) === '{') { try { localStorage.removeItem(key); } catch (e) {} return Promise.resolve(null); }   // rascunho antigo (sem cifra): descarta
      if (!V.ok()) return Promise.resolve(null);
      return V.dev.dec(raw).then(function (t) { if (!t) return null; try { return JSON.parse(t); } catch (e) { return null; } });
    },
    clear: function (key) { dseq[key] = (dseq[key] || 0) + 1; try { localStorage.removeItem(key); } catch (e) {} }
  };

  /* ------------------------------ ligação com o login ------------------------------ */
  // O app chama depois do login: garante a chave da conta neste aparelho (pede a senha só se precisar). Devolve Promise<boolean>.
  V.ready = function (id, o) {
    if (!V.ok() || !id) return Promise.resolve(false);
    return V.has(id).then(function (has) {
      if (has) return true;
      // sem chave da empresa o cofre ainda não está ativo: não há o que proteger nem motivo para pedir a senha
      return V.org.pub().then(function (pub) { return pub ? V.require(id, o).then(function (me) { return !!me; }) : false; });
    }).catch(function () { return false; });
  };
  // Depois do login/cadastro (com a senha em mãos) prepara as chaves da conta. Chamado uma vez por SV.start.
  V.hookAuth = function () {
    var a = SV.auth; if (!a || a.__vault) return; a.__vault = true;
    function after(id, senha) {
      var guard = new Promise(function (res) { setTimeout(function () { res({ state: 'timeout' }); }, 20000); });
      return Promise.race([V.signedIn(id, senha), guard]).then(function (r) { try { SV.emit('vault:state', { id: id, state: r && r.state }); } catch (e) {} return id; }, function () { return id; });
    }
    var L = a.login, R = a.register, AS = a.adminSignIn, AC = a.adminCreate;
    a.login = function (role, ident, senha) { return L.apply(a, arguments).then(function (id) { return id ? after(id, senha) : id; }); };
    a.register = function (role, f) { return R.apply(a, arguments).then(function (id) { return id ? after(id, f.senha) : id; }); };
    if (AS) a.adminSignIn = function (email, senha) { return AS.apply(a, arguments).then(function (uid) { return after(uid, senha); }); };
    if (AC) a.adminCreate = function (email, senha) { return AC.apply(a, arguments).then(function (uid) { return after(uid, senha); }); };
  };
})();

/* ---------------- segurança: um único aparelho por conta ---------------- */
async function loginDevice(id) {
  const c = SV.devsec.claim(id);
  if (c.ok) { startSession(id, false, c.sid); return; }
  if (c.code === 'busy') {
    const ago = Math.max(1, Math.round((Date.now() - (c.other.visto || 0)) / 1000)), when = ago < 60 ? 'agora há pouco' : 'há ' + Math.round(ago / 60) + ' min';
    const retry = await confirmBox({ title: 'Conta em uso em outro aparelho', text: `Sua conta está aberta em outro aparelho (${esc(c.other.nome)}, ativo ${when}).\n\nPor segurança, só é permitido usar a conta em UM aparelho por vez.\n\nSaia da conta no outro aparelho (Menu › Sair) e tente de novo. Se perdeu o aparelho, é só esperar ${Math.round(SV.CONFIG.SESSION_TTL_S / 60)} minutos sem uso dele ou falar com o suporte: ${esc(SV.EMPRESA.email)}`, ok: 'Tentar de novo', cancel: 'Fechar' });
    if (retry) loginDevice(id);
    return;
  }
  confirmDevice(id, c);
}
function confirmDevice(id, c) {
  const s = sheet({ center: true, title: 'Confirme que é você', html: `<p class="dlg-text" style="margin-top:0">Este é um aparelho novo para a sua conta (último acesso: ${esc(c.other.nome || '—')}). Por segurança, confirme seus dados.</p>
    <label class="field" id="w_dvc"><span>CPF</span><input id="dv_cpf" data-mask="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00"><div class="err"></div></label>
    <label class="field" id="w_dvn"><span>Data de nascimento</span><input id="dv_nasc" type="date"><div class="err"></div></label>
    <div class="dlg-actions"><button class="btn out lg" data-dv="no">Cancelar</button><button class="btn pink lg" data-dv="ok" id="dv_ok">Confirmar</button></div>` });
  s.el.addEventListener('click', e => {
    const b = e.target.closest('[data-dv]'); if (!b) return;
    if (b.dataset.dv === 'no') { s.close(); return; }
    fieldErr('w_dvc', ''); fieldErr('w_dvn', '');
    if (S.devFails >= 5 && Date.now() < S.devLockUntil) { fieldErr('w_dvn', 'Muitas tentativas. Aguarde alguns segundos.'); return; }
    if (!SV.devsec.confirmIdentity(id, $('#dv_cpf', s.el).value, $('#dv_nasc', s.el).value)) {
      S.devFails++; if (S.devFails >= 5) { S.devLockUntil = Date.now() + 30000; S.devFails = 0; }
      SV.devsec.log(id, 'verificacao_falhou'); fieldErr('w_dvn', 'CPF ou data de nascimento não conferem.'); return;
    }
    S.devFails = 0; s.close();
    const r = SV.devsec.claim(id, { confirmed: true });
    if (r.ok) startSession(id, false, r.sid); else loginDevice(id);
  });
}

async function validateStep() {
  collect(); const d = W.d; let ok = true; const bad = (id, m) => { werr(id, m); ok = false; };
  if (W.step === 0) {
    $('#ph-err').style.display = d.foto ? 'none' : 'block'; if (!d.foto) ok = false;
    werr('nome', ''); if (String(d.nome || '').trim().split(/\s+/).length < 2) bad('nome', 'Informe nome e sobrenome.');
    werr('cpf', ''); if (!SV.validCPF(d.cpf)) bad('cpf', 'CPF inválido.');
    werr('nasc', ''); if (!d.nasc || SV.age(d.nasc) < 18) bad('nasc', 'É preciso ter 18 anos ou mais.'); else if (SV.age(d.nasc) > 110) bad('nasc', 'Data inválida.');
    werr('tel', ''); if (!SV.validPhone(d.tel)) bad('tel', 'Informe um celular com DDD.');
    if (ok) { const ex = await SV.auth.exists(ROLE, { cpf: d.cpf, tel: d.tel }); if (ex.cpf) bad('cpf', 'Já existe um cadastro com este CPF.'); if (ex.tel) bad('tel', 'Já existe um cadastro com este celular.'); }
  } else if (W.step === 1) {
    werr('email', ''); if (!SV.validEmail(d.email)) bad('email', 'E-mail inválido.');
    werr('senha', ''); if (!(String(d.senha || '').length >= 8 && /[A-Za-z]/.test(d.senha) && /\d/.test(d.senha))) bad('senha', 'Mínimo de 8 caracteres, com letras e números.');
    werr('senha2', ''); if (d.senha !== d.senha2) bad('senha2', 'As senhas não conferem.');
    if (ok && (await SV.auth.exists(ROLE, { email: d.email })).email) bad('email', 'Já existe um cadastro com este e-mail.');
  } else if (W.step === 2) {
    ['cep', 'rua', 'num', 'bairro', 'cidade', 'uf', 'emNome', 'emTel'].forEach(k => werr(k, ''));
    const any = ['cep', 'rua', 'num', 'bairro', 'cidade'].some(k => String(d[k] || '').trim());
    if (any) {
      if (SV.digits(d.cep).length !== 8) bad('cep', 'CEP inválido.');
      if (!String(d.rua || '').trim()) bad('rua', 'Informe a rua.');
      if (!String(d.num || '').trim()) bad('num', 'Informe o número.');
      if (!String(d.bairro || '').trim()) bad('bairro', 'Informe o bairro.');
      if (!String(d.cidade || '').trim()) bad('cidade', 'Informe a cidade.');
      if (!/^[A-Za-z]{2}$/.test(String(d.uf || '').trim())) bad('uf', 'UF inválida.');
    }
    if (String(d.emNome || '').trim() || String(d.emTel || '').trim()) {
      if (!String(d.emNome || '').trim()) bad('emNome', 'Informe o nome.');
      if (!SV.validPhone(d.emTel)) bad('emTel', 'Informe um celular com DDD.');
    }
  } else if (W.step === 3) {
    const keys = ['aTermos', 'aPriv', 'aPag', 'aVer', 'aMaior'], all = keys.every(k => d[k]);
    $('#term-err').style.display = all ? 'none' : 'block'; keys.forEach(k => $('#w_' + k).classList.toggle('bad', !d[k])); if (!all) ok = false;
  }
  if (!ok) { const f = $('.bad,.err[style*="block"]', $('#wz-body')); if (f && f.scrollIntoView) f.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  return ok;
}

  btn.disabled = true;

async function regFail(e) {
  const c = e && (e.svCode || e.code), at = { email_em_uso: [1, 'email'], 'auth/email-already-in-use': [1, 'email'], 'auth/invalid-email': [1, 'email'], 'auth/weak-password': [1, 'senha'], cpf_em_uso: [0, 'cpf'], tel_em_uso: [0, 'tel'] }[c];

async function finishRegister() {
  const d = W.d, now = Date.now(), v = SV.CONFIG.TERMS_VERSION, ac = { v: v, em: now };
  const hasAddr = ['rua', 'num', 'bairro', 'cidade'].every(k => String(d[k] || '').trim());
  let id; try { id = await SV.auth.register(ROLE, { email: d.email.trim().toLowerCase(), cpf: SV.digits(d.cpf), tel: SV.digits(d.tel), senha: d.senha }); } catch (e) { await regFail(e); return; }
  const cli = {
    id: id, nome: d.nome.trim().replace(/\s+/g, ' '), cpf: SV.digits(d.cpf), nascimento: d.nasc,
    tel: SV.digits(d.tel), email: d.email.trim().toLowerCase(), foto: d.foto || '',
    endereco: hasAddr ? { cep: SV.digits(d.cep), street: d.rua.trim(), number: d.num.trim(), complement: (d.comp || '').trim(), neighborhood: d.bairro.trim(), city: d.cidade.trim(), state: String(d.uf || '').trim().toUpperCase() } : null,
    emergencia: String(d.emNome || '').trim() ? { nome: d.emNome.trim(), tel: SV.digits(d.emTel) } : null,
    status: 'aprovado', statusMotivo: '', criadoEm: now,
    aceites: { termos: ac, privacidade: ac, pagamento: ac, veracidade: ac, maioridade: ac, localizacao: ac },
    prefs: { som: true, vib: true, vol: 85, notif: true }
  };
  let failed = false; SV.on('db:error', () => { failed = true; });
  try { await SV.db.set('clients/' + id, cli); } catch (e) { failed = true; }
  if (failed) { SV.db.remove('clients/' + id); if (!SV.net.active) SV.db.remove('auth/' + id); await alertBox('Não foi possível salvar', SV.net.active ? 'Não consegui salvar o cadastro. Verifique a internet e toque em concluir de novo (use o mesmo e-mail e senha).' : 'O armazenamento do aparelho está cheio. Tente uma foto menor e conclua novamente.'); return; }
  SV.draft.clear(DRAFT);
  W.d = {}; W.step = 0;
  startSession(id, true, SV.devsec.claim(id, { confirmed: true }).sid); // este aparelho passa a ser o aparelho da conta
}

/* ======================================================================
   APP DO CLIENTE — parte 2: sessão, início, pedido, mapa e endereço
   ====================================================================== */

/* -------------------------------- sessão -------------------------------- */
function startSession(id, fresh, sid) {
  S.meId = id; S.me = SV.db.get('clients/' + id);
  if (!S.me) { SV.sess.clear(ROLE); renderAuth('welcome'); return; }
  S.sid = sid || SV.devsec.claim(id, { confirmed: true }).sid; S.kicked = false; S.lastBeat = Date.now();
  SV.sess.set(ROLE, id, S.sid);
  S.mode = 'home'; showScreen('home'); applyPrefs(); renderHome();
  SV.vault.ready(id);   // garante a chave de criptografia da conta neste aparelho (pede a senha só se faltar)
  S.unsubs.forEach(f => f()); S.unsubs = [];
  S.unsubs.push(SV.devsec.on(id, onSess));
  S.unsubs.push(SV.db.on('clients/' + id, onMe));
  S.unsubs.push(SV.db.on('config/geral', renderNotice));
  S.unsubs.push(SV.db.on('changeRequests', onChangeReqs));
  S.unsubs.push(SV.db.on('requests', onRequests));
  clearInterval(S.timer); S.timer = setInterval(tick, 1000);
  if (fresh) setTimeout(() => alertBox('Conta criada! 🎉', S.me.status === 'pendente' ? 'Nossa equipe vai liberar seu acesso em breve. Você será avisado aqui.' : 'Escolha um serviço para começar. O pagamento é feito direto com o prestador, sem taxa da plataforma.'), 400);
  else setTimeout(checkUnrated, 900);
}
function logout(msg) {
  const sid = S.sid; S.sid = null; if (sid) SV.devsec.release(S.meId, sid); // libera a conta para entrar em outro aparelho
  S.unsubs.forEach(f => f()); S.unsubs = []; clearInterval(S.timer);   // primeiro desliga os ouvintes; depois limpa a sessão
  SV.sess.clear(ROLE);
  try { if (msg) sessionStorage.setItem('sv_msg', msg); } catch (e) {}
  location.reload();
}
/* --------- um aparelho por vez: se outro aparelho assumir a conta, este é desconectado --------- */
function onSess(r) {
  if (S.kicked || !S.sid || (r && r.sid === S.sid)) return;
  let msg;

  else if (!r.sid) msg = 'Sua sessão foi encerrada por segurança. Entre novamente.';
  else if (r.deviceId === SV.device.id) msg = 'Sua conta foi aberta em outra janela deste aparelho. Esta janela foi desconectada.';
  else msg = `Sua conta foi acessada em outro aparelho (${esc(r.deviceNome || 'desconhecido')}). Por segurança, você foi desconectado aqui.\n\nSe não foi você, troque sua senha em “Esqueci minha senha” e avise o suporte: ${esc(SV.EMPRESA.email)}`;

}
function kicked(msg) {

}

  if (S.profileSheet && !S.profileSheet.s.closed) S.profileSheet.renderProt();
  const b = $('#blocked'), st = SV.effStatus(p);
  if (st === 'suspenso' || st === 'bloqueado' || st === 'excluido') {
    b.innerHTML = `<div class="ico">${st === 'suspenso' ? '⏸️' : '⛔'}</div><h2>Conta ${st === 'suspenso' ? 'suspensa' : st === 'excluido' ? 'excluída' : 'bloqueada'}</h2><p class="muted">Você não pode fazer pedidos no momento.</p><div class="why"><b>Motivo informado pela administração:</b>\n${esc(p.statusMotivo || 'Não informado.')}</div>${p.suspensoAte && st === 'suspenso' ? `<p class="small muted" style="margin-top:8px">Previsão de retorno: <b>${SV.fmtDateTime(p.suspensoAte)}</b>. Depois disso sua conta volta ao normal sozinha.</p>` : ''}<p class="small muted">Dúvidas? Fale com o suporte: ${esc(SV.EMPRESA.email)}</p><button class="btn out lg" id="blk-out" style="margin-top:14px">Sair da conta</button>`;

  } else if (st === 'pendente') {

    b.classList.remove('on');

function tick() {
  if (S.kicked) return;

  const r = S.active;
  if (r && r.status === 'pendente') {
    const t = D.turn(r, now); if (t.stage === 'expired') D.advance(r.id, t.idx);   // passa a vez se o prestador não respondeu

  if (S.demoProv && S.ticks % 20 === 0) demoBeat(); //@DEMO-LINE
  if (S.ticks % 30 === 0) renderBanner();
  if (S.ticks % 5 === 0 && S.me && S.me.status === 'suspenso' && S.me.suspensoAte && SV.effStatus(S.me) !== 'suspenso') onMe(S.me);   // a suspensão venceu

const fmtClock = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return SV.pad(Math.floor(s / 60)) + ':' + SV.pad(s % 60); };

/* ------------------------- localização do cliente ------------------------- */
// O navegador (não o app) é quem mostra a janela “Permitir localização?”. Chamamos aqui, logo depois do toque do usuário.
function requestLocation() {
  stopGeo(); S.geo = { state: 'wait' }; renderGeoLine();
  if (!navigator.geolocation) { S.geo = { state: 'fail', code: 0 }; renderGeoLine(); return; }
  try { navigator.permissions && navigator.permissions.query({ name: 'geolocation' }).then(r => { S.permState = r.state; if (S.geo.state === 'fail' || S.geo.state === 'denied') renderGeoLine(); }).catch(() => {}); } catch (e) {}
  SV.geo.once(onPos, geoFail, { high: false, timeout: 15000, maxAge: 30000 }); // 1) posição rápida (rede/Wi-Fi)
  S.watchId = SV.geo.watch(onPos, geoFail);                                    // 2) GPS preciso, refina enquanto o cliente não mexer no mapa
}
function stopGeo() { if (S.watchId != null) SV.geo.stop(S.watchId); S.watchId = null; }
function geoFail(e) {
  if (S.geo.state === 'ok') return;                                              // já tenho posição: ignora falhas isoladas
  S.geo = { state: e && e.code === 1 ? 'denied' : 'fail', code: e ? e.code : 0 }; renderGeoLine();
}
function onPos(p) {
  const c = S.pos;                                                                 // depois de uma posição boa, uma pior e recente (Wi-Fi/antena) é ignorada
  if (c && Date.now() - (c.ts || 0) <= 20000 && (p.acc || 99999) > Math.max(60, (c.acc || 99999) * 2)) return;
  S.pos = p; S.lastPos = p; S.geo = { state: 'ok', acc: p.acc };
  if (S.mode !== 'addr') return;
  const firstFix = !S.locOk; S.locOk = true; placeMe();
  if (!S.userMoved) {
    const far = firstFix || !S.addrLoc || SV.haversine(S.addrLoc, p) > 0.02;      // mais de 20 m de diferença
    if (far) {
      S.addrLoc = { lat: p.lat, lng: p.lng };
      if (S.map) S.map.setView([p.lat, p.lng], 18, { animate: false });              // zoom em cima de onde o cliente está
      scheduleReverse();                                                              // descobre rua, bairro e cidade por NOME
    }
  }
  renderGeoLine();
}

/* --------------------------- endereço (por nome) -------------------------- */
const ADDR_KEYS = ['street', 'number', 'neighborhood', 'city', 'state'];
function openAddress() {
  S.mode = 'addr'; S.addr = { street: '', number: '', neighborhood: '', city: '', state: '', complement: '', reference: '' }; S.dirty = {};
  S.addrLoc = null; S.locOk = false; S.userMoved = false; S.dragNow = false; S.revFail = false; S.revDone = false;
  showScreen('map'); clearMarkers(); mapChrome(); renderAddrPanel();
  requestLocation();                                   // 1º: pede a localização ao navegador (ainda dentro do toque do cliente)
  try { initMap(); } catch (e) { S.mapFail = true; }  // 2º: mapa
  if (S.map && S.lastPos) S.map.setView([S.lastPos.lat, S.lastPos.lng], 18);
  if (S.map && S.pos) { placeMe(); }
}
$('#mp-back').addEventListener('click', () => { if (S.mode !== 'addr') return; stopGeo(); S.mode = 'home'; showScreen('flow'); });
function setField(k, v) { S.addr[k] = v; const i = $('#ad_' + k); if (i && i.value !== v) i.value = v; }
function renderGeoLine() {
  const box = $('#geo-box'); if (!box || S.mode !== 'addr') return;
  const g = S.geo; let h = '';
  if (g.state === 'wait' && !S.pos) h = '<div class="geo-line wait"><span>📍</span><span class="grow">Procurando sua localização… se o navegador perguntar, toque em <b>Permitir</b>.</span></div>';

/* --------------------------------- chat ---------------------------------- */
function loadSeen(id) { try { return Number(localStorage.getItem('svc_cs_' + id) || 0); } catch (e) { return 0; } }
function markSeen() { const r = S.active; if (!r) return; const t = Date.now() + 1; S.chatSeen[r.id] = t; try { localStorage.setItem('svc_cs_' + r.id, String(t)); } catch (e) {} }
function unreadCount() { const r = S.active; if (!r) return 0; const seen = S.chatSeen[r.id] || 0; return S.chatMsgs.filter(m => m.de === 'prestador' && m.ts > seen).length; }
function subscribeChat(reqId) {
  if (S.chatUnsub) S.chatUnsub();
  let firstCall = true; S.chatKnown = new Set(); S.chatMsgs = []; S.chatSeen[reqId] = loadSeen(reqId);
  // as mensagens chegam cifradas; SV.chat.watch abre cada uma neste aparelho e entrega o texto já legível
  S.chatUnsub = SV.chat.watch(reqId, 'cliente', msgs => {
    S.chatMsgs = msgs;
    const fresh = msgs.filter(m => !m.locked && !S.chatKnown.has(m.id)); msgs.forEach(m => { if (!m.locked) S.chatKnown.add(m.id); });
    if (!firstCall) fresh.forEach(m => { if (m.de === 'prestador') onProvMsg(m); });
    firstCall = false;
    if (S.chatOpen && !S.chatOpen.closed) renderChat(); else renderPanel(true);
  });
}
function onProvMsg(m) {
  SV.audio.chime();                                            // som + vibração de mensagem recebida
  notify('Mensagem de ' + first(m.nome), m.texto, 'msg');
  if (S.chatOpen && !S.chatOpen.closed) { markSeen(); return; }
  showMsgOverlay(m);                                           // a mensagem cobre a tela toda
}
function showMsgOverlay(m) {
  const o = $('#msgov');
  o.innerHTML = `<div class="from">💬 Mensagem de ${esc(shortName(m.nome))}</div><div class="txt">${esc(m.texto)}</div><input id="mo-in" placeholder="Responder…" maxlength="300" autocomplete="off" aria-label="Resposta"><div class="row2"><button class="btn lg" data-mo="send">Enviar</button><button class="btn lg line" data-mo="open">Abrir chat</button></div><button class="btn lg line block" style="margin-top:10px" data-mo="close">Fechar</button>`;
  o.classList.add('on');
}
function hideMsgOverlay() { const o = $('#msgov'); o.classList.remove('on'); o.innerHTML = ''; }
$('#msgov').addEventListener('click', e => {
  const b = e.target.closest('[data-mo]'); if (!b) return; const k = b.dataset.mo;
  if (k === 'send') { const i = $('#mo-in'); if (i.value.trim() && S.active) { SV.chat.send(S.active.id, 'cliente', S.me.nome, i.value); toast('Mensagem enviada.'); markSeen(); hideMsgOverlay(); renderPanel(true); } }
  else if (k === 'open') { hideMsgOverlay(); openChat(); }
  else { markSeen(); hideMsgOverlay(); renderPanel(true); }
});
$('#msgov').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const b = $('[data-mo=send]', $('#msgov')); b && b.click(); } });
function openChat() {
  const r = S.active; if (!r || r.status === 'pendente') { toast('O chat abre quando um prestador aceitar.'); return; }
  if (S.chatOpen && !S.chatOpen.closed) return;
  hideMsgOverlay(); markSeen();
  const s = S.chatOpen = sheet({ title: shortName(r.providerNome), full: true, html: '<div class="chat-list" id="chat-list"></div>', onClose: () => { markSeen(); renderPanel(true); } });
  const quick = ['Estou esperando aqui', 'Pode vir pelo portão lateral', 'Em quanto tempo você chega?', 'Obrigado!'];
  const foot = document.createElement('div');
  foot.innerHTML = `<div class="quick" style="padding:0 16px">${quick.map(q => `<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div><form class="chat-in" id="chat-form"><input id="chat-input" placeholder="Digite uma mensagem…" maxlength="500" autocomplete="off" aria-label="Mensagem"><button type="submit" aria-label="Enviar"><span class="ic">${IC.send}</span></button></form>`;
  $('.sheet', s.el).appendChild(foot);

function renderChat() {
  const l = $('#chat-list'); if (!l) return;
  l.innerHTML = S.chatMsgs.map(m => `<div class="msg ${m.de === 'cliente' ? 'me' : m.de === 'prestador' ? 'them' : 'sys'}">${esc(m.texto)}${m.de === 'sistema' ? '' : `<small>${SV.fmtTime(m.ts)}</small>`}</div>`).join('') || '<p class="muted" style="text-align:center;margin-top:30px">Nenhuma mensagem ainda. Diga olá! 👋</p>';

      ${r.notes ? `<div class="small" style="margin-top:8px;font-style:italic">“${esc(r.notes)}”</div>` : ''}`,
      foot: (canRate ? '<button class="btn pink lg" data-hh="rate" style="flex:1">Avaliar</button>' : '') + (canBlock ? '<button class="btn out lg" data-hh="block" style="flex:1">🚫 Bloquear prestador</button>' : '') + (canAgain ? '<button class="btn out lg" data-hh="again" style="flex:1">Pedir de novo</button>' : '') + (SV.ACTIVE.concat(['pendente']).indexOf(r.status) > -1 ? '<button class="btn pink lg" data-hh="open" style="flex:1">Ver pedido</button>' : '')
    });
    d.el.addEventListener('click', ev => {
      const h = ev.target.closest('[data-hh]'); if (!h) return;
      if (h.dataset.hh === 'rate') { d.close(); s.close(); openRating(r); }
      else if (h.dataset.hh === 'block') { confirmBox({ title: 'Bloquear ' + first(r.providerNome) + '?', text: 'Você não será mais atendido por este prestador, e ele não é avisado. Dá para desbloquear em Menu › Prestadores bloqueados.', ok: 'Bloquear' }).then(yes => { if (!yes) return; D.block('cliente', r.id).then(res => { d.close(); toast(res.ok ? first(r.providerNome) + ' foi bloqueado.' : 'Não foi possível bloquear agora.', 4000); }); }); }
      else if (h.dataset.hh === 'again') { d.close(); s.close(); startOrder(r.categoryId, r.optionId); }
      else if (h.dataset.hh === 'open') { d.close(); s.close(); openActive(); }
    });
  });
}

const permOn = p => !!((S.me.permissoes || {})[p]);
function myChangeReqs(tipo) { return Object.values(SV.db.get('changeRequests') || {}).filter(r => r.clientId === S.meId && r.tipo === tipo).sort((x, y) => y.criadoEm - x.criadoEm); }
function consumePerm(perm, tipo) {
  SV.db.set('clients/' + S.meId + '/permissoes/' + perm, false);
  const r = myChangeReqs(tipo).find(x => x.status === 'aprovada'); if (r) SV.db.update('changeRequests/' + r.id, { status: 'concluida', concluidoEm: Date.now() });
}
function askChange(tipo) {
  const T = { foto: ['Solicitar troca de foto', 'Por que você precisa trocar a foto?'], nome: ['Solicitar correção de nome', 'Explique o motivo da correção.'] }[tipo];
  const s = sheet({ title: T[0], html: `<p class="muted" style="margin-bottom:14px">Por segurança, a administração analisa e libera esta alteração. Você será avisado aqui no app.</p>${tipo === 'nome' ? '<label class="field" id="w_crn"><span>Nome correto (igual ao documento)</span><input id="cr-nome" maxlength="80"><div class="err"></div></label>' : ''}<label class="field" id="w_crm"><span>${T[1]}</span><textarea id="cr-motivo" maxlength="300" rows="3"></textarea><div class="err"></div></label>`, foot: '<button class="btn pink lg block" id="cr-send">Enviar solicitação</button>' });
  $('#cr-send', s.el).onclick = () => {

    const motivo = $('#cr-motivo', s.el).value.trim(), novo = tipo === 'nome' ? $('#cr-nome', s.el).value.trim().replace(/\s+/g, ' ') : '';
    if (tipo === 'nome' && novo.split(' ').length < 2) { fieldErr('w_crn', 'Informe nome e sobrenome.'); ok = false; }
    if (motivo.length < 10) { fieldErr('w_crm', 'Explique em pelo menos 10 letras.'); ok = false; }

    if (myChangeReqs(tipo).some(x => x.status === 'aberta')) { toast('Você já tem uma solicitação aberta.'); s.close(); return; }
    SV.db.push('changeRequests', { clientId: S.meId, papel: 'cliente', nome: S.me.nome, tipo, motivo, novoNome: novo || null, status: 'aberta', criadoEm: Date.now() }, 'cr_');

}

function demoProvider() {
  const b = demoBase(), cats = SV.catalog.list().map(c => c.id);
  SV.db.set('providers/p_demo', { id: 'p_demo', demo: true, nome: 'Carlos Prestador Teste', cpf: '00000000000', tel: '11977776666', email: 'carlos@teste.com', foto: '', status: 'aprovado', online: true, categorias: cats, raioKm: 80, pix: { tipo: 'cel', chave: '11977776666' }, pagamentos: ['pix', 'dinheiro', 'debito', 'credito'], criadoEm: Date.now() });
  SV.db.set('locs/p_demo', { lat: b.lat + 0.012, lng: b.lng + 0.009, ts: Date.now() });
  S.demoProv = true;
}
function demoBeat() { const l = SV.db.get('locs/p_demo'); if (l) SV.db.update('locs/p_demo', { ts: Date.now() }); }
function openDemo() {
  const s = sheet({ title: '🧪 Modo teste', html: `<div class="notice">Ferramentas para testar sem o app do prestador. Desative com SV.CONFIG.DEMO_MODE = false.</div>
    <button class="btn pink block" data-t="prov">1) Ligar um prestador de teste (online)</button>
    <button class="btn out block" style="margin-top:10px" data-t="acc">2) Prestador de teste aceita o pedido</button>
    <button class="btn out block" style="margin-top:10px" data-t="next">3) Avançar: chegou › iniciou › finalizou</button>
    <button class="btn out block" style="margin-top:10px" data-t="msg">Prestador de teste envia mensagem</button>
    <button class="btn out block" style="margin-top:10px" data-t="move">Aproximar o prestador de teste</button>
    <button class="btn out block" style="margin-top:10px" data-t="pcancel">Prestador de teste cancela (volta a procurar)</button>
    <button class="btn out block" style="margin-top:10px" data-t="acancel">ADM cancela o pedido</button>
    <button class="btn out block" style="margin-top:10px" data-t="susp">Simular suspensão pela administração</button>
    <button class="btn out block" style="margin-top:10px" data-t="lfoto">ADM libera a troca de foto</button>
    <button class="btn out block" style="margin-top:10px" data-t="negar">ADM nega o pedido aberto</button>
    <button class="btn out block" style="margin-top:10px" data-t="outro">Simular: outro celular entra na conta (desconecta este)</button>
    <button class="btn out block" style="margin-top:10px" data-t="encerra">Simular: ADM encerra minha sessão</button>
    <button class="btn danger block" style="margin-top:10px" data-t="reset">Apagar todos os dados locais</button>` });
  s.el.addEventListener('click', async e => {
    const b = e.target.closest('[data-t]'); if (!b) return; const k = b.dataset.t, r = S.active;
    if (k === 'prov') { demoProvider(); s.close(); toast('Prestador de teste online. Faça um pedido (ou use o que está aberto).', 5000); }
    else if (k === 'acc') {
      if (!r || r.status !== 'pendente') { toast('Não há pedido procurando prestador.'); return; }
      if (!S.demoProv) demoProvider();
      const res = D.accept(r.id, 'p_demo'); s.close(); if (!res.ok) toast(res.reason || 'Não foi possível aceitar.', 5000);
    }
    else if (k === 'next') {
      if (!r || SV.ACTIVE.indexOf(r.status) < 0) { toast('Aceite um pedido primeiro.'); return; }
      const nx = { a_caminho: 'no_local', no_local: 'em_andamento', em_andamento: 'concluido' }[r.status]; s.close(); D.setStatus(r.id, r.providerId, nx);
    }
    else if (k === 'msg') { if (!r || !r.providerId) toast('Aceite um pedido primeiro.'); else { s.close(); SV.chat.send(r.id, 'prestador', r.providerNome, pick(['Olá! Estou a caminho.', 'Chego em 5 minutinhos 🚗', 'Pode abrir o portão, por favor?', 'Cheguei! Estou na frente.'])); } }
    else if (k === 'move') { if (!r || !r.providerId) { toast('Aceite um pedido primeiro.'); return; } const l = SV.db.get('trk/' + r.id) || SV.db.get('locs/' + r.providerId) || demoBase(), nl = { lat: l.lat + (r.loc.lat - l.lat) * .6, lng: l.lng + (r.loc.lng - l.lng) * .6, ts: Date.now() }; SV.db.set('locs/' + r.providerId, nl); SV.db.set('trk/' + r.id, nl); s.close(); }
    else if (k === 'pcancel') { if (!r || !r.providerId) toast('Aceite um pedido primeiro.'); else { s.close(); D.providerCancel(r.id, r.providerId, 'Teste de cancelamento'); } }
    else if (k === 'acancel') { if (!r) toast('Nenhum pedido ativo.'); else { s.close(); D.cancel(r.id, 'admin', 'Teste: pedido cancelado pela administração.'); } }
    else if (k === 'susp') { s.close(); SV.db.update('clients/' + S.meId, { status: 'suspenso', statusMotivo: 'Teste: dados inconsistentes. Fale com o suporte para regularizar.' }); setTimeout(() => SV.db.update('clients/' + S.meId, { status: 'aprovado', statusMotivo: '' }), 6000); }
    else if (k === 'lfoto') {
      const ab = myChangeReqs('foto').find(x => x.status === 'aberta');
      if (ab) SV.db.update('changeRequests/' + ab.id, { status: 'aprovada', respondidoEm: Date.now() });
      SV.db.set('clients/' + S.meId + '/permissoes/trocarFoto', true); s.close();
    }
    else if (k === 'negar') {
      const ab = Object.values(SV.db.get('changeRequests') || {}).filter(x => x.clientId === S.meId && x.status === 'aberta')[0];
      if (!ab) toast('Nenhum pedido aberto.'); else { SV.db.update('changeRequests/' + ab.id, { status: 'negada', resposta: 'Teste: não foi possível confirmar o motivo.', respondidoEm: Date.now() }); s.close(); }
    }
    else if (k === 'outro') { s.close(); const cur = SV.db.get('sessions/' + S.meId) || {}, ap = cur.aparelhos || {}; ap['dv_teste'] = { nome: 'Android · Chrome (teste)', primeiro: Date.now(), ultimo: Date.now() }; SV.db.set('sessions/' + S.meId, { id: S.meId, sid: SV.uid('ss_'), deviceId: 'dv_teste', deviceNome: 'Android · Chrome (teste)', loginEm: Date.now(), seen: Date.now(), aparelhos: ap }); }
    else if (k === 'encerra') { s.close(); SV.devsec.revoke(S.meId, 'teste_adm'); }
    else if (k === 'reset') { if (await confirmBox({ title: 'Apagar tudo?', text: 'Remove cadastros, pedidos e conversas deste navegador.', ok: 'Apagar', danger: true })) { SV.db.clearAll(); SV.sess.clear(ROLE); SV.draft.clear(DRAFT); location.reload(); } }
  });
}

MENU_EXTRA.demo = openDemo;
//@DEMO-END
/* ----------------------------------- início ------------------------------- */
SV.start(ROLE, function boot() {
  try { const m = sessionStorage.getItem('sv_msg'); if (m) { sessionStorage.removeItem('sv_msg'); setTimeout(() => toast(m, 6000), 500); } } catch (e) {}
  const id = SV.sess.get(ROLE);
  if (id && SV.db.get('clients/' + id)) {
    const cur = SV.devsec.get(id), sid = SV.sess.getSid(ROLE);
    if (!cur) startSession(id, false, SV.devsec.claim(id, { confirmed: true }).sid);
    else if (sid && cur.sid === sid) startSession(id, false, sid);                    // sessão deste aparelho continua válida
    else { SV.sess.clear(ROLE); renderAuth('welcome'); setTimeout(() => toast('Sua sessão terminou. Entre novamente.', 5000), 400); }
  } else renderAuth('welcome');
});
if (SV.CONFIG.DEMO_MODE) window.__S = S; // depuração (só no modo teste) //@DEMO-LINE

})();
</script>
